<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metro Corner Store – Inventory & Sales</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#F8FAFC;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0F172A}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:14px}
.inp{width:100%;border:1px solid #E2E8F0;border-radius:10px;padding:.5rem .75rem;font-size:.875rem;background:#fff;outline:none}
.inp:focus{border-color:#6366F1;box-shadow:0 0 0 3px #E0E7FF}
.btn{border-radius:10px;padding:.5rem .9rem;font-size:.875rem;font-weight:600;transition:.15s}
.btn-p{background:#4F46E5;color:#fff}.btn-p:hover{background:#4338CA}
.btn-g{background:#10B981;color:#fff}.btn-g:hover{background:#059669}.btn-g:disabled{background:#CBD5E1;cursor:not-allowed}
.btn-o{background:#fff;border:1px solid #E2E8F0;color:#334155}.btn-o:hover{background:#F1F5F9}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{animation:up .2s ease}
</style></head>
<body>
<div id="bd" class="fixed inset-0 bg-slate-900/40 z-30 hidden lg:hidden" onclick="closeSide()"></div>
<aside id="side" class="fixed inset-y-0 left-0 w-60 bg-white border-r border-slate-200 z-40 -translate-x-full lg:translate-x-0 transition-transform flex flex-col">
  <div class="px-5 py-5 flex items-center gap-2"><div class="w-9 h-9 rounded-xl bg-indigo-600 text-white grid place-items-center font-bold">M</div><div><div class="font-bold leading-tight">Metro Corner</div><div class="text-xs text-slate-500">Inventory &amp; POS</div></div></div>
  <nav class="px-3 space-y-1 flex-1" id="nav"></nav>
  <div class="p-4 text-xs text-slate-400">Data is saved in this browser.<br><button class="underline hover:text-slate-600 mt-1" onclick="resetDemo()">Reset sample data</button></div>
</aside>
<div class="lg:ml-60">
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center gap-3">
    <button class="lg:hidden btn btn-o !px-3" onclick="openSide()" aria-label="Menu">☰</button>
    <h1 class="font-bold text-lg hidden sm:block whitespace-nowrap">Metro Corner Store</h1>
    <div class="flex-1 max-w-xl mx-auto relative"><input id="gs" class="inp !pl-9" placeholder="Search products, SKU or receipts…" oninput="gsearch(this.value)"><span class="absolute left-3 top-2 text-slate-400">🔍</span></div>
    <button class="btn btn-p whitespace-nowrap" onclick="editProduct()">+ Add Product</button>
  </header>
  <main id="view" class="p-4 sm:p-6 max-w-7xl mx-auto"></main>
</div>
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50"></div>
<div id="toasts" class="fixed bottom-4 right-4 z-[60] space-y-2"></div>

<script>
const $=s=>document.querySelector(s),LS='mcs_inventory_v1',TAX=.12;
const fmt=n=>'₱'+(+n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const tile=(e,h)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},85%,93%)"/><stop offset="1" stop-color="hsl(${h},70%,80%)"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><text x="100" y="128" font-size="86" text-anchor="middle">${e}</text></svg>`);
const PH='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#F1F5F9"/><g fill="none" stroke="#94A3B8" stroke-width="6" stroke-linejoin="round"><path d="M100 60l40 20v40l-40 20-40-20V80z"/><path d="M60 80l40 20 40-20M100 100v40"/></g></svg>');
const imgErr=el=>{el.onerror=null;el.src=PH};
const P=[['Whole Milk 1L','GRO-1001','Grocery',48,65,24,'🥛',210],['Sourdough Bread','BAK-1002','Bakery',55,85,3,'🍞',35],['Free-Range Eggs (12)','GRO-1003','Grocery',90,125,18,'🥚',45],['Fresh Bananas 1kg','PRO-1004','Produce',42,70,30,'🍌',50],['Red Apples 1kg','PRO-1005','Produce',95,140,4,'🍎',0],['Cold Brew Coffee','BEV-1006','Beverages',60,95,16,'☕',25],['Sparkling Water','BEV-1007','Beverages',18,30,48,'💧',195],['Potato Chips','SNK-1008','Snacks',28,45,40,'🥔',40],['Dark Chocolate Bar','SNK-1009','Snacks',55,90,2,'🍫',20],['USB-C Cable 1m','TEC-1010','Electronics',120,220,12,'🔌',230],['Wireless Earbuds','TEC-1011','Electronics',650,1190,7,'🎧',260],['Power Bank 10,000mAh','TEC-1012','Electronics',480,850,9,'🔋',150]];
let S={products:[],sales:[],seq:1001};
let ui={view:'dashboard',mode:'grid',cat:'All',q:'',cart:[],pay:'Cash',sPay:'All',sRange:'All'};
let mImg='';

function mkSale(items,pay,ts){const subtotal=r2(items.reduce((a,i)=>a+i.price*i.qty,0)),tax=r2(subtotal*TAX);
  return{id:'R-'+(S.seq++),ts,items,pay,subtotal,tax,total:r2(subtotal+tax),profit:r2(items.reduce((a,i)=>a+(i.price-i.cost)*i.qty,0))}}
function seed(){
  S={products:P.map((p,i)=>({id:'p'+(i+1),name:p[0],sku:p[1],cat:p[2],cost:p[3],price:p[4],stock:p[5],image:tile(p[6],p[7])})),sales:[],seq:1001};
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  for(let d=6;d>=0;d--){const n=3+Math.floor(rnd()*3);for(let k=0;k<n;k++){
    const dt=new Date();dt.setDate(dt.getDate()-d);dt.setHours(9+Math.floor(rnd()*9),Math.floor(rnd()*60),0,0);
    const items=[];const m=1+Math.floor(rnd()*3);
    for(let j=0;j<m;j++){const p=S.products[Math.floor(rnd()*S.products.length)];if(!items.find(x=>x.id===p.id))items.push({id:p.id,name:p.name,sku:p.sku,qty:1+Math.floor(rnd()*3),price:p.price,cost:p.cost})}
    S.sales.push(mkSale(items,['Cash','Card','E-Wallet'][Math.floor(rnd()*3)],dt.getTime()))}}
  S.sales.sort((a,b)=>b.ts-a.ts);save()}
function load(){try{const r=localStorage.getItem(LS);if(r){const d=JSON.parse(r);if(d&&d.products&&d.sales){S=d;return}}}catch(e){}seed()}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function resetDemo(){modal(`<div class="p-6"><h3 class="font-bold text-lg">Reset sample data?</h3><p class="text-sm text-slate-500 mt-1">This replaces all products and sales with the original demo data.</p><div class="flex justify-end gap-2 mt-5"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="seed();ui.cart=[];closeModal();render();toast('Sample data restored')">Reset</button></div></div>`,'max-w-sm')}

/* ---------- helpers ---------- */
function toast(msg,type='ok'){const c={ok:'bg-emerald-600',warn:'bg-amber-500',error:'bg-rose-600'}[type];const t=document.createElement('div');
  t.className=`toast ${c} text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg max-w-xs`;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2800)}
function modal(html,w='max-w-2xl'){const m=$('#modal');m.innerHTML=`<div class="bg-white rounded-2xl shadow-2xl w-full ${w} max-h-[92vh] overflow-auto">${html}</div>`;m.classList.remove('hidden');m.classList.add('flex')}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.classList.remove('flex');m.innerHTML=''}
function openSide(){$('#side').classList.remove('-translate-x-full');$('#bd').classList.remove('hidden')}
function closeSide(){$('#side').classList.add('-translate-x-full');$('#bd').classList.add('hidden')}
async function dl(name,rows){const data='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  try{const d=window.claude?await claude.use('downloads'):null;if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code==='declined')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=name;a.click()}catch(e){toast('Export isn’t available in this view','error')}}
const badge=s=>s<=0?'<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700">Out of stock</span>':s<5?`<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Only ${s} left</span>`:`<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">${s} in stock</span>`;
const im=(p,c='w-full h-full object-cover')=>`<img src="${esc(p.image||PH)}" alt="${esc(p.name)}" loading="lazy" class="${c}" onerror="imgErr(this)">`;
const cats=()=>[...new Set(S.products.map(p=>p.cat))].sort();
const match=p=>!ui.q||(p.name+' '+p.sku).toLowerCase().includes(ui.q.toLowerCase());
const filtered=()=>S.products.filter(p=>(ui.cat==='All'||p.cat===ui.cat)&&match(p));

/* ---------- nav / render ---------- */
const NAV=[['dashboard','📊','Dashboard'],['inventory','📦','Inventory'],['pos','🛒','Point of Sale'],['sales','🧾','Sales History']];
function render(){
  $('#nav').innerHTML=NAV.map(n=>`<button data-nav="${n[0]}" onclick="go('${n[0]}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-left ${ui.view===n[0]?'bg-indigo-50 text-indigo-700':'text-slate-600 hover:bg-slate-50'}"><span>${n[1]}</span>${n[2]}</button>`).join('');
  $('#view').innerHTML={dashboard:dash,inventory:inv,pos:posV,sales:salesV}[ui.view]();
  if(ui.view==='pos'){posUpdate();$('#scan').focus()}}
function go(v){ui.view=v;closeSide();render();window.scrollTo(0,0)}
function gsearch(v){ui.q=v;if(ui.view==='dashboard')ui.view='inventory';render()}

/* ---------- dashboard ---------- */
const kpi=(l,v,s,c)=>`<div class="card p-4"><div class="text-xs font-semibold text-slate-500 uppercase tracking-wide">${l}</div><div class="text-2xl font-bold mt-1 ${c}">${v}</div><div class="text-xs text-slate-400 mt-1">${s}</div></div>`;
function chart(){const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d)}
  const vals=days.map(d=>S.sales.filter(s=>new Date(s.ts).toDateString()===d.toDateString()).reduce((a,s)=>a+s.subtotal,0));
  const mx=Math.max(...vals,1),W=560,H=230,B=30,T=24,bw=W/7;let g='';
  [0,.5,1].forEach(f=>{const y=H-B-f*(H-B-T);g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#E2E8F0"/>`});
  vals.forEach((v,i)=>{const h=v/mx*(H-B-T),x=i*bw+bw*.18,y=H-B-h;
    g+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,2)}" rx="6" fill="${i===6?'#4F46E5':'#A5B4FC'}"/><text x="${x+bw*.32}" y="${y-6}" font-size="11" text-anchor="middle" fill="#475569">${v?'₱'+Math.round(v).toLocaleString():''}</text><text x="${x+bw*.32}" y="${H-10}" font-size="12" text-anchor="middle" fill="#64748B">${days[i].toLocaleDateString('en',{weekday:'short'})}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Daily sales for the last 7 days">${g}</svg>`}
function dash(){const rev=S.sales.reduce((a,s)=>a+s.subtotal,0),pr=S.sales.reduce((a,s)=>a+s.profit,0),low=S.products.filter(p=>p.stock<5).sort((a,b)=>a.stock-b.stock),units=S.products.reduce((a,p)=>a+p.stock,0);
  return `<h2 class="text-xl font-bold mb-4">Dashboard</h2>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">${kpi('Total Revenue',fmt(rev),'excl. 12% VAT · '+S.sales.length+' sales','text-slate-900')}${kpi('Total Profit',fmt(pr),rev?(pr/rev*100).toFixed(1)+'% margin':'—','text-emerald-600')}${kpi('Low Stock Alerts',low.length,'items under 5 units',low.length?'text-amber-600':'text-slate-900')}${kpi('Products in Stock',units.toLocaleString(),S.products.length+' products','text-indigo-600')}</div>
  <div class="grid lg:grid-cols-3 gap-4 mt-4"><div class="card p-5 lg:col-span-2"><div class="font-semibold mb-2">Daily sales · last 7 days</div>${chart()}</div>
  <div class="card p-5"><div class="font-semibold mb-3">Low stock alerts</div>${low.length?`<div class="space-y-3">${low.map(p=>`<div class="flex items-center gap-3"><div class="w-11 h-11 rounded-lg overflow-hidden shrink-0">${im(p)}</div><div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">${esc(p.name)}</div><div class="text-xs ${p.stock?'text-amber-600':'text-rose-600'}">${p.stock?p.stock+' left':'Out of stock'}</div></div><button class="btn btn-o !py-1 !px-2.5 !text-xs !text-emerald-700" onclick="restock('${p.id}')">Restock (+10)</button></div>`).join('')}</div>`:'<div class="text-sm text-slate-500">All items are well stocked 🎉</div>'}</div></div>`}
function restock(id){const p=S.products.find(x=>x.id===id);p.stock+=10;save();toast(`${p.name} restocked → ${p.stock} units`);render()}

/* ---------- inventory ---------- */
function inv(){const list=filtered(),cs=['All',...cats()];
  const chips=cs.map(c=>`<button onclick="ui.cat='${c}';render()" class="btn !py-1.5 !text-xs ${ui.cat===c?'btn-p':'btn-o'}">${c}</button>`).join('');
  const body=!list.length?'<div class="card p-10 text-center text-slate-500">No products match your filters.</div>':ui.mode==='grid'?
  `<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4">${list.map(p=>`<div class="card overflow-hidden flex flex-col"><div class="aspect-square bg-slate-100">${im(p)}</div><div class="p-3 flex-1 flex flex-col"><div class="font-semibold text-sm leading-tight">${esc(p.name)}</div><div class="text-xs text-slate-400 mt-0.5">${esc(p.sku)} · ${esc(p.cat)}</div><div class="flex items-center justify-between mt-2"><span class="font-bold text-indigo-600">${fmt(p.price)}</span>${badge(p.stock)}</div><div class="text-xs text-slate-400 mt-1">Cost ${fmt(p.cost)}</div><div class="flex gap-2 mt-3 pt-3 border-t border-slate-100 mt-auto"><button class="btn btn-o flex-1 !py-1 !text-xs" onclick="editProduct('${p.id}')">Edit</button><button class="btn btn-o !py-1 !text-xs !text-rose-600" onclick="delProduct('${p.id}')">Delete</button></div></div></div>`).join('')}</div>`:
  `<div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="text-xs uppercase text-slate-500 bg-slate-50"><tr><th class="text-left p-3">Product</th><th class="text-left p-3">SKU</th><th class="text-left p-3">Category</th><th class="text-right p-3">Cost</th><th class="text-right p-3">Price</th><th class="text-right p-3">Margin</th><th class="text-left p-3">Stock</th><th class="p-3"></th></tr></thead><tbody>${list.map(p=>`<tr class="border-t border-slate-100"><td class="p-3"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-lg overflow-hidden shrink-0">${im(p)}</div><span class="font-semibold">${esc(p.name)}</span></div></td><td class="p-3 text-slate-500">${esc(p.sku)}</td><td class="p-3">${esc(p.cat)}</td><td class="p-3 text-right">${fmt(p.cost)}</td><td class="p-3 text-right font-semibold">${fmt(p.price)}</td><td class="p-3 text-right text-emerald-600">${p.price?((p.price-p.cost)/p.price*100).toFixed(0):0}%</td><td class="p-3">${badge(p.stock)}</td><td class="p-3 whitespace-nowrap text-right"><button class="text-indigo-600 font-semibold mr-3" onclick="editProduct('${p.id}')">Edit</button><button class="text-rose-600 font-semibold" onclick="delProduct('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="flex flex-wrap items-center justify-between gap-3 mb-4"><h2 class="text-xl font-bold">Inventory <span class="text-sm font-normal text-slate-400">${list.length} items</span></h2><div class="flex gap-2"><div class="flex rounded-xl border border-slate-200 bg-white overflow-hidden text-sm font-semibold"><button class="px-3 py-2 ${ui.mode==='grid'?'bg-indigo-50 text-indigo-700':'text-slate-500'}" onclick="ui.mode='grid';render()">▦ Grid</button><button class="px-3 py-2 ${ui.mode==='table'?'bg-indigo-50 text-indigo-700':'text-slate-500'}" onclick="ui.mode='table';render()">☰ Table</button></div><button class="btn btn-o" onclick="exportInv()">⬇ Export CSV</button></div></div><div class="flex flex-wrap gap-2 mb-4">${chips}</div>${body}`}
function exportInv(){dl('inventory.csv',[['Name','SKU','Category','Cost Price','Selling Price','Stock','Margin %'],...S.products.map(p=>[p.name,p.sku,p.cat,p.cost,p.price,p.stock,p.price?((p.price-p.cost)/p.price*100).toFixed(1):0])])}
function delProduct(id){const p=S.products.find(x=>x.id===id);modal(`<div class="p-6"><h3 class="font-bold text-lg">Delete “${esc(p.name)}”?</h3><p class="text-sm text-slate-500 mt-1">Past sales keep their records. This can’t be undone.</p><div class="flex justify-end gap-2 mt-5"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn !bg-rose-600 !text-white" onclick="S.products=S.products.filter(x=>x.id!=='${id}');ui.cart=ui.cart.filter(c=>c.id!=='${id}');save();closeModal();render();toast('Product deleted','warn')">Delete</button></div></div>`,'max-w-sm')}

/* ---------- add / edit modal ---------- */
function editProduct(id){const p=id?S.products.find(x=>x.id===id):{name:'',sku:'',cat:'',cost:'',price:'',stock:'',image:''};mImg=p.image||'';
  modal(`<div class="p-6"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">${id?'Edit product':'Add product'}</h3><button class="text-slate-400 text-xl" onclick="closeModal()" aria-label="Close">✕</button></div>
  <div class="grid sm:grid-cols-5 gap-5"><div class="sm:col-span-3 grid grid-cols-2 gap-3">
  <label class="col-span-2 text-xs font-semibold text-slate-500">Product name<input id="f_name" class="inp mt-1" value="${esc(p.name)}"></label>
  <label class="text-xs font-semibold text-slate-500">SKU<input id="f_sku" class="inp mt-1" value="${esc(p.sku)}"></label>
  <label class="text-xs font-semibold text-slate-500">Category<input id="f_cat" list="cl" class="inp mt-1" value="${esc(p.cat)}"><datalist id="cl">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
  <label class="text-xs font-semibold text-slate-500">Cost price (₱)<input id="f_cost" type="number" min="0" step="0.01" class="inp mt-1" value="${p.cost}" oninput="margin()"></label>
  <label class="text-xs font-semibold text-slate-500">Selling price (₱)<input id="f_price" type="number" min="0" step="0.01" class="inp mt-1" value="${p.price}" oninput="margin()"></label>
  <label class="text-xs font-semibold text-slate-500">Stock quantity<input id="f_stock" type="number" min="0" step="1" class="inp mt-1" value="${p.stock}"></label>
  <div id="mg" class="rounded-xl bg-slate-50 border border-slate-200 p-2.5 text-xs"></div>
  <label class="col-span-2 text-xs font-semibold text-slate-500">Image URL<input id="f_img" class="inp mt-1" placeholder="https://…" value="${p.image&&!p.image.startsWith('data:')?esc(p.image):''}" oninput="mImg=this.value.trim();prev()"></label>
  <label class="col-span-2 text-xs font-semibold text-slate-500">…or upload a picture<input type="file" accept="image/*" class="block mt-1 text-xs" onchange="upImg(this)"></label></div>
  <div class="sm:col-span-2"><div class="text-xs font-semibold text-slate-500 mb-1">Preview</div><div class="aspect-square rounded-xl overflow-hidden bg-slate-100 border border-slate-200"><img id="pv" src="${esc(p.image||PH)}" class="w-full h-full object-cover" onerror="imgErr(this)" alt="Preview"></div></div></div>
  <div id="err" class="text-sm text-rose-600 mt-3"></div>
  <div class="flex justify-end gap-2 mt-4"><button class="btn btn-o" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="saveProduct('${id||''}')">Save product</button></div></div>`);margin()}
function margin(){const c=parseFloat($('#f_cost').value),s=parseFloat($('#f_price').value),el=$('#mg');
  if(isNaN(c)||isNaN(s)){el.innerHTML='<span class="text-slate-400">Enter cost &amp; price to see margin</span>';return}
  const u=s-c,m=s?u/s*100:0;el.innerHTML=`<div class="text-slate-500">Profit / unit</div><div class="font-bold ${u>=0?'text-emerald-600':'text-rose-600'}">${fmt(u)} · ${m.toFixed(1)}%</div>`}
function prev(){$('#pv').src=mImg||PH}
function upImg(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);mImg=c.toDataURL('image/jpeg',.82);$('#f_img').value='';prev()};i.onerror=()=>toast('Could not read that image','error');i.src=rd.result};rd.readAsDataURL(f)}
function saveProduct(id){const v=k=>$('#f_'+k).value.trim(),name=v('name'),sku=v('sku').toUpperCase(),cat=v('cat'),cost=parseFloat(v('cost')),price=parseFloat(v('price')),stock=parseInt(v('stock'));
  const e=!name?'Please enter a product name.':!sku?'Please enter a SKU.':!cat?'Please choose a category.':isNaN(cost)||cost<0?'Enter a valid cost price.':isNaN(price)||price<0?'Enter a valid selling price.':isNaN(stock)||stock<0?'Enter a valid stock quantity.':S.products.some(p=>p.sku===sku&&p.id!==id)?'That SKU is already used by another product.':'';
  if(e){$('#err').textContent=e;return}
  const d={name,sku,cat,cost,price,stock,image:mImg||tile('📦',220)};
  if(id){Object.assign(S.products.find(p=>p.id===id),d);toast('Product updated')}else{S.products.unshift({id:'p'+Date.now(),...d});toast('Product added')}
  if(stock===0)toast(`${name} has zero stock`,'warn');save();closeModal();render()}

/* ---------- POS ---------- */
function posV(){return `<h2 class="text-xl font-bold mb-4">Point of Sale</h2><div class="grid xl:grid-cols-3 gap-4"><div class="xl:col-span-2">
  <div class="card p-3 mb-4 flex items-center gap-3"><span class="text-xl">▮▯▮▮</span><input id="scan" class="inp" placeholder="Scan or type SKU and press Enter…" autofocus autocomplete="off" onkeydown="if(event.key==='Enter'){scanSku(this.value);this.value=''}"></div>
  <div id="posGrid"></div></div><div id="cart" class="xl:sticky xl:top-4 self-start"></div></div>`}
const inCart=id=>(ui.cart.find(c=>c.id===id)||{qty:0}).qty;
function posUpdate(){const list=filtered();
  $('#posGrid').innerHTML=list.length?`<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${list.map(p=>{const left=p.stock-inCart(p.id);return `<button ${p.stock<=0?'disabled':''} onclick="addCart('${p.id}')" class="card overflow-hidden text-left transition hover:border-indigo-400 hover:shadow-md ${p.stock<=0?'opacity-50 cursor-not-allowed':''}"><div class="aspect-[4/3] bg-slate-100">${im(p)}</div><div class="p-2.5"><div class="text-sm font-semibold leading-tight truncate">${esc(p.name)}</div><div class="flex items-center justify-between mt-1.5"><span class="font-bold text-indigo-600 text-sm">${fmt(p.price)}</span>${badge(left)}</div></div></button>`}).join('')}</div>`:'<div class="card p-8 text-center text-slate-500">No products found.</div>';
  const sub=r2(ui.cart.reduce((a,c)=>a+S.products.find(p=>p.id===c.id).price*c.qty,0)),tax=r2(sub*TAX);
  $('#cart').innerHTML=`<div class="card p-4"><div class="font-semibold mb-3 flex justify-between">Current order${ui.cart.length?`<button class="text-xs text-slate-400 hover:text-rose-600" onclick="ui.cart=[];posUpdate()">Clear</button>`:''}</div>
  ${ui.cart.length?`<div class="space-y-3 max-h-80 overflow-auto">${ui.cart.map(c=>{const p=S.products.find(x=>x.id===c.id);return `<div class="flex items-center gap-2.5"><div class="w-11 h-11 rounded-lg overflow-hidden shrink-0">${im(p)}</div><div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">${esc(p.name)}</div><div class="text-xs text-slate-400">${fmt(p.price)} each</div></div><div class="flex items-center border border-slate-200 rounded-lg"><button class="px-2 py-1 text-slate-600" onclick="qty('${p.id}',-1)" aria-label="Decrease">−</button><span class="w-6 text-center text-sm font-semibold">${c.qty}</span><button class="px-2 py-1 text-slate-600" onclick="qty('${p.id}',1)" aria-label="Increase">+</button></div><button class="text-slate-300 hover:text-rose-600" onclick="rm('${p.id}')" aria-label="Remove">🗑</button></div>`}).join('')}</div>`:'<div class="text-sm text-slate-400 py-8 text-center">Cart is empty.<br>Tap a product or scan a SKU.</div>'}
  <div class="border-t border-slate-100 mt-4 pt-3 space-y-1 text-sm"><div class="flex justify-between text-slate-500"><span>Subtotal</span><span>${fmt(sub)}</span></div><div class="flex justify-between text-slate-500"><span>VAT (12%)</span><span>${fmt(tax)}</span></div><div class="flex justify-between font-bold text-lg pt-1"><span>Total</span><span>${fmt(sub+tax)}</span></div></div>
  <div class="grid grid-cols-3 gap-2 mt-4">${['Cash','Card','E-Wallet'].map(m=>`<button class="btn !py-2 !text-xs ${ui.pay===m?'btn-p':'btn-o'}" onclick="ui.pay='${m}';posUpdate()">${m}</button>`).join('')}</div>
  <button class="btn btn-g w-full mt-3 !py-3" ${ui.cart.length?'':'disabled'} onclick="checkout()">Complete Sale · ${fmt(sub+tax)}</button></div>`}
function addCart(id){const p=S.products.find(x=>x.id===id),c=ui.cart.find(x=>x.id===id);
  if(p.stock<=0){toast(`${p.name} is out of stock`,'error');return}
  if(inCart(id)>=p.stock){toast(`Only ${p.stock} of ${p.name} available`,'warn');return}
  c?c.qty++:ui.cart.push({id,qty:1});toast(`Added ${p.name}`);posUpdate()}
function qty(id,d){const p=S.products.find(x=>x.id===id),c=ui.cart.find(x=>x.id===id),n=c.qty+d;
  if(n<1){rm(id);return}if(n>p.stock){toast(`Only ${p.stock} of ${p.name} available`,'warn');return}c.qty=n;posUpdate()}
function rm(id){ui.cart=ui.cart.filter(c=>c.id!==id);posUpdate()}
function scanSku(v){v=v.trim().toLowerCase();if(!v)return;const p=S.products.find(x=>x.sku.toLowerCase()===v);p?addCart(p.id):toast(`No product with SKU “${v.toUpperCase()}”`,'error');$('#scan').focus()}
function checkout(){if(!ui.cart.length)return;
  const items=ui.cart.map(c=>{const p=S.products.find(x=>x.id===c.id);return{id:p.id,name:p.name,sku:p.sku,qty:c.qty,price:p.price,cost:p.cost}});
  const s=mkSale(items,ui.pay,Date.now());S.sales.unshift(s);
  ui.cart.forEach(c=>{const p=S.products.find(x=>x.id===c.id);p.stock-=c.qty;if(p.stock===0)setTimeout(()=>toast(`${p.name} is now out of stock`,'warn'),400)});
  ui.cart=[];save();toast(`Sale ${s.id} complete · ${fmt(s.total)}`);posUpdate();$('#scan').focus()}

/* ---------- sales history ---------- */
function filteredSales(){const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),q=ui.q.toLowerCase();
  return S.sales.filter(s=>(ui.sPay==='All'||s.pay===ui.sPay)&&(ui.sRange==='All'||(ui.sRange==='Today'?s.ts>=t0:s.ts>=t0-6*864e5))&&(!q||s.id.toLowerCase().includes(q)||s.items.some(i=>i.name.toLowerCase().includes(q))))}
const itemsTxt=s=>s.items.map(i=>`${i.qty}× ${i.name}`).join(', ');
const dt=ts=>new Date(ts).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function salesV(){const list=filteredSales(),tot=list.reduce((a,s)=>a+s.total,0),pr=list.reduce((a,s)=>a+s.profit,0);
  const sel=(k,opts)=>`<select class="inp !w-auto" onchange="ui.${k}=this.value;render()">${opts.map(o=>`<option ${ui[k]===o?'selected':''}>${o}</option>`).join('')}</select>`;
  return `<div class="flex flex-wrap items-center justify-between gap-3 mb-4"><h2 class="text-xl font-bold">Sales History <span class="text-sm font-normal text-slate-400">${list.length} transactions</span></h2><div class="flex flex-wrap gap-2">${sel('sRange',['All','Today','Last 7 days'])}${sel('sPay',['All','Cash','Card','E-Wallet'])}<button class="btn btn-o" onclick="exportSales()">⬇ Export CSV</button></div></div>
  <div class="grid grid-cols-2 gap-3 mb-4">${kpi('Filtered total',fmt(tot),'incl. VAT','')}${kpi('Filtered net profit',fmt(pr),'','text-emerald-600')}</div>
  ${list.length?`<div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="text-xs uppercase text-slate-500 bg-slate-50"><tr><th class="text-left p-3">Receipt</th><th class="text-left p-3">Date &amp; time</th><th class="text-left p-3">Items sold</th><th class="text-left p-3">Payment</th><th class="text-right p-3">Total</th><th class="text-right p-3">Net profit</th></tr></thead><tbody>${list.map(s=>`<tr class="border-t border-slate-100 align-top"><td class="p-3 font-semibold text-indigo-600 whitespace-nowrap">${s.id}</td><td class="p-3 whitespace-nowrap text-slate-500">${dt(s.ts)}</td><td class="p-3 min-w-[14rem]">${esc(itemsTxt(s))}</td><td class="p-3"><span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100">${s.pay}</span></td><td class="p-3 text-right font-semibold whitespace-nowrap">${fmt(s.total)}</td><td class="p-3 text-right text-emerald-600 whitespace-nowrap">${fmt(s.profit)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card p-10 text-center text-slate-500">No transactions match your filters.</div>'}`}
function exportSales(){dl('sales-history.csv',[['Receipt ID','Date & Time','Items Sold','Payment Method','Subtotal','VAT','Total','Net Profit'],...filteredSales().map(s=>[s.id,new Date(s.ts).toLocaleString('en-PH'),itemsTxt(s),s.pay,s.subtotal,s.tax,s.total,s.profit])])}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
load();render();
</script></body></html>
